# =============================================================================
# BFM fast-environment template (generated-template — DO NOT use in production).
# Copy target: _work-tmp/fast-env/application.properties (via `just fast-prepare`,
# helper-owned). Adapted from dev/local/application.properties for the fast
# topology: PG-wire stubs + per-node MiniPG WireMock, no Docker, no live PG.
#
# Fast topology (exact tuples):
#   BFM (server.address + watcher.cluster-port) ... 127.0.0.1:9995
#   PG node 1 (PG-wire stub, primary) ........... 127.0.10.11:5432
#   PG node 2 (PG-wire stub, replica) ........... 127.0.10.12:5433
#   MiniPG WireMock per node (same port) ........ 127.0.10.11:7779, 127.0.10.12:7779
#   Peer BFM .................................... no-pair (stub deferred)
#
# @@FAST_*@@ tokens are synthetic per-run placeholders: the helper's
# `fast-prepare` MUST substitute a fresh random value for each token on every
# prepare (never commit a rendered file). No real or dev-shared secrets here.
# =============================================================================

# clustername should be same all of the bfm servers
app.bfm-hc-clustername          = BFMCluster

app.custom-logo-path            =

server.pguser                   = @@FAST_PGUSER@@
server.pgpassword               = @@FAST_PGPASSWORD@@

# Explicit bind so the fast run never listens on a wildcard address.
server.address                  = 127.0.0.1
watcher.cluster-port            = 9995
watcher.cluster-pair            = no-pair

app.timeout-ignorance-count     = 3

# use only one of {availability,manual,performance,protection}
# or it will run in availability mode!
bfm.watch-strategy              = availability

server.pglist                   = 127.0.10.11:5432,127.0.10.12:5433

bfm.user-crypted                = false
bfm.use-tls                     = false
minipg.use-tls                  = false
bfm.tls-secret                  =
bfm.tls-key-store               = bfm.p12

minipg.username                 = @@FAST_MINIPG_USER@@
minipg.password                 = @@FAST_MINIPG_PASSWORD@@
minipg.port                     = 7779
heartbeat.interval              = 10
heartbeat.query                 = select 1

#1G, 24M, 120K
bfm.data-loss-tolerance         = 120K
#3H=3 Hour or 1D=1 Day
bfm.status-file-expire          = 1H
#rejoin or stop
bfm.ex-master-behavior          = rejoin
bfm.basebackup-slave-join       = true
bfm.mail-notification-enabled   = false
#multiple receiver must seperate with comma
# bfm.notification-mail-receivers = user1.email@gmail.com,user2.email@gmail.com

# Fast env: mail disabled (minimal spring.mail.* so the context still binds).
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Resolves from RUN_DIR (_work-tmp/fast-env/run) to _work-tmp/fast-env/logs/app.log.
logging.file.name=../logs/app.log
