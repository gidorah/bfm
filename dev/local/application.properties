# =============================================================================
# BFM local-dev template (generated-template — DO NOT use in production).
# Copy target: _work-tmp/local/application.properties (via `just local-prepare`).
# Derived from rpm/src/main/resources/settings/application.properties with
# local-run isolation values (plaintext dev-only secrets, mail disabled).
#
# Local port split (avoids clashing with a production install on the same host):
#   BFM watcher (local) ......... 9995
#   BFM4Patroni (unchanged) ..... 9994
#   minipg sidecar (explicit) ... 7779  (its default 9995 would clash with BFM)
# =============================================================================

# clustername should be same all of the bfm servers
app.bfm-hc-clustername          = BFMCluster

app.custom-logo-path            =

server.pguser                   = bfmuser
server.pgpassword               = dev-only-plaintext

watcher.cluster-port            = 9995
watcher.cluster-pair            = no-pair

app.timeout-ignorance-count     = 3

# use only one of {availability,manual,performance,protection}
# or it will run in availability mode!
bfm.watch-strategy              = availability

server.pglist                   = 127.0.0.1:5432,127.0.0.1:5433

bfm.user-crypted                = false
bfm.use-tls                     = false
minipg.use-tls                  = false
bfm.tls-secret                  =
bfm.tls-key-store               = bfm.p12

minipg.username                 = minipg
minipg.password                 = dev-only-plaintext
minipg.port                     = 7779
heartbeat.interval              = 10
heartbeat.query                 = select 1

#1G, 24M, 120K
bfm.data-loss-tolerance         = 120K
#3H=3 Hour or 1D=1 Day
bfm.status-file-expire          = 1H
#rejoin or stop
bfm.ex-master-behavior          = rejoin
bfm.basebackup-slave-join       = true
bfm.mail-notification-enabled   = false
#multiple receiver must seperate with comma
# bfm.notification-mail-receivers = user1.email@gmail.com,user2.email@gmail.com

# Local dev: mail disabled (minimal spring.mail.* so the context still binds).
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Resolves from RUN_DIR (_work-tmp/local/run) to _work-tmp/local/logs/app.log.
logging.file.name=../logs/app.log
