# =============================================================================
# BFM live-environment template (generated-template — DO NOT use in production).
# Copy target: _work-tmp/live-env/application.properties (via `just live-prepare`,
# helper-owned). Values mirror dev/fast-env/application.properties for the same
# fixed disposable topology, but here the nodes are REAL: a disposable 2-node
# PostgreSQL streaming-replication cluster (Docker, Worker-A compose.yaml) with
# one real minipg4patroni jar sidecar per node. BFM owns failover — no stubs.
#
# Live topology (exact tuples; issue #23 contract, ADR-0005):
#   BFM (server.address + watcher.cluster-port) ... 127.0.0.1:9995
#   Bridge subnet (static member IPs, no published ports) ... 172.30.51.0/24
#   PG node 1 (live-pg1, primary) ............... 172.30.51.11:5432
#   PG node 2 (live-pg2, replica) ............... 172.30.51.12:5432
#   MiniPG jar per node (same port) ............. 172.30.51.11:7779, 172.30.51.12:7779
#   VIP (spare bridge IP, jar moves it) ......... 172.30.51.100
#   Peer BFM .................................... no-pair
#
# Fixed test-only credentials for local development (disposable bridge env):
# operator login bfm/bfm, MiniPG bfm/bfm, live PG bfm/bfm.
# Disposable-only, never reused outside this env. DO NOT use in production.
# =============================================================================

# clustername should be same all of the bfm servers
app.bfm-hc-clustername          = BFMCluster

app.custom-logo-path            =

server.pguser                   = bfm
server.pgpassword               = bfm

# Explicit bind so the live run never listens on a wildcard address.
server.address                  = 127.0.0.1
watcher.cluster-port            = 9995
watcher.cluster-pair            = no-pair

app.timeout-ignorance-count     = 3

# use only one of {availability,manual,performance,protection}
# or it will run in availability mode!
bfm.watch-strategy              = availability

server.pglist                   = 172.30.51.11:5432,172.30.51.12:5432

bfm.user-crypted                = false
bfm.use-tls                     = false
minipg.use-tls                  = false
bfm.tls-secret                  =
bfm.tls-key-store               = bfm.p12

minipg.username                 = bfm
minipg.password                 = bfm
minipg.port                     = 7779
heartbeat.interval              = 10
heartbeat.query                 = select 1

#1G, 24M, 120K
bfm.data-loss-tolerance         = 120K
#3H=3 Hour or 1D=1 Day
bfm.status-file-expire          = 1H
#rejoin or stop
bfm.ex-master-behavior          = rejoin
bfm.basebackup-slave-join       = true
bfm.mail-notification-enabled   = false
#multiple receiver must seperate with comma
# bfm.notification-mail-receivers = user1.email@gmail.com,user2.email@gmail.com

# Live env: mail disabled (minimal spring.mail.* so the context still binds).
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Resolves from RUN_DIR (_work-tmp/live-env/run) to _work-tmp/live-env/logs/app.log.
logging.file.name=../logs/app.log
