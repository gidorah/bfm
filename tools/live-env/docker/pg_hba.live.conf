# Disposable trust snippet appended (once) to pg_hba.conf by entrypoint.sh.
#
# Trust for replication + the bfm superuser within the compose network and the
# loopback-adjacent publish IPs only. Test-only: DO NOT use in production.
# Marker line first: the entrypoint greps for it to stay idempotent.
# --- bfm-live-trust-BEGIN ---
local   all             all                                     trust
host    all             all             127.0.0.0/8             trust
host    all             all             10.0.0.0/8              trust
host    all             all             172.16.0.0/12           trust
host    all             all             192.168.0.0/16          trust
host    replication     all             127.0.0.0/8             trust
host    replication     all             10.0.0.0/8              trust
host    replication     all             172.16.0.0/12           trust
host    replication     all             192.168.0.0/16          trust
host    all             all             ::1/128                 trust
host    replication     all             ::1/128                 trust
# --- bfm-live-trust-END ---
