# Disposable trust snippet appended (once) to pg_hba.conf by entrypoint.sh.
#
# Trust for replication + the bfm superuser within the pinned disposable
# bridge subnet 172.30.51.0/24 plus container-local loopback only.
# Test-only: DO NOT use in production.
# Marker line first: the entrypoint greps for it to stay idempotent.
# --- bfm-live-trust-BEGIN ---
local   all             all                                     trust
host    all             all             127.0.0.0/8             trust
host    all             all             172.30.51.0/24          trust
host    replication     all             127.0.0.0/8             trust
host    replication     all             172.30.51.0/24          trust
host    all             all             ::1/128                 trust
host    replication     all             ::1/128                 trust
# --- bfm-live-trust-END ---
